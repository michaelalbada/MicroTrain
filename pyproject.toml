[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microtrain"
version = "0.1.0"
description = "Modern LLM post-training, stripped to the essentials"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "huggingface-hub>=0.24",
  "safetensors>=0.4",
  "tokenizers>=0.19",
]

[project.optional-dependencies]
dev = ["pytest>=8", "transformers>=4.40"]

[tool.setuptools.packages.find]
include = ["microtrain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

